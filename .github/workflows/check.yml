name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.12", "3.x"]  # the release the scripts were tested on, and the newest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Every script answers --help
        run: for s in scripts/*.py; do python3 "$s" --help > /dev/null; done
      - name: protocol.json and the example parse
        run: python3 -c "import json; [json.load(open(p)) for p in ('protocol.json', 'examples/inwove/sources.json', 'examples/inwove/slices.json')]"
